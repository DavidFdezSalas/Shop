name: Build and Push Shop.APIIdentity Docker Image

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'Shop.APIIdentity/**'
      - 'Shop.ServiceDefaults/**'
      - 'Shop.Shared/**'
      - '.github/workflows/identity-api-docker.yml'
      - 'docker-compose.integration.yml'
      - 'postman/**'
  pull_request:
    branches:
      - master
      - main
    paths:
      - 'Shop.APIIdentity/**'
      - 'Shop.ServiceDefaults/**'
      - 'Shop.Shared/**'
      - 'postman/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image name (lowercase owner)
        id: vars
        run: |
          owner_lower=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "owner=${owner_lower}" >> $GITHUB_OUTPUT
          echo "image=${owner_lower}/shop-apiidentity" >> $GITHUB_OUTPUT

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Shop.APIIdentity/Dockerfile
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ steps.vars.outputs.image }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
